<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meetup</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 120px;
  font-size: 42px;
}

#text {
  margin-top: 40px;
  font-size: 28px;
  font-weight: 500;
}

/* buttons */
button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  margin: 10px;
  cursor: pointer;
}

#yes {
  background: white;
  color: #ff4d6d;
}

#no {
  background: #ff4d6d;
  color: white;
  position: absolute;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 5s linear infinite;
}

@keyframes float {
  to { transform: translateY(-800px); }
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3</h1>

<div id="text"></div>

<div id="buttons" style="display:none;">
  <button id="yes">YES</button>
  <button id="no">NO</button>
</div>

<script>
let msgs = [
  "Regardless of our fights 🤪",
  "I miss u sm here 😔🎀",
  "Meetup at my place? 😘",
  "11 April 🐙",
  "— from tikki <3"
];

let i = 0;

function showMessages() {
  if (i < msgs.length) {
    document.getElementById("text").innerText = msgs[i];
    i++;
    setTimeout(showMessages, 2000);
  } else {
    document.getElementById("buttons").style.display = "block";
  }
}

// auto start
window.onload = showMessages;

// YES button
document.getElementById("yes").onclick = function() {
  document.getElementById("text").innerText = "Yayyy see you soon 💘";
};

// NO button moves 😂
let no = document.getElementById("no");
no.onmouseover = function() {
  no.style.top = Math.random() * 80 + "%";
  no.style.left = Math.random() * 80 + "%";
};

// floating hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 5000);
}, 400);
</script>

</body>
</html>
