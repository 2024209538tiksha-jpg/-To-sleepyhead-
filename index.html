<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meetup 💌</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 100px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  margin: 10px;
  cursor: pointer;
}

#text {
  margin-top: 30px;
  font-size: 24px;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 5s linear infinite;
}

@keyframes float {
  to { transform: translateY(-800px); }
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3 🥺</h1>

<button onclick="nextMsg()">Start ❤️</button>

<div id="text"></div>

<div id="choice" style="display:none;">
  <button onclick="yes()">YES 💖</button>
  <button id="no">NO 😏</button>
</div>

<script>
let msgs = [
  "Regardless of our fights 🤪",
  "I miss u sm here 😔🎀",
  "Meetup at my place? 😘",
  "11 April 💌",
  "— from tikki"
];

let i = 0;

function nextMsg() {
  if (i < msgs.length) {
    document.getElementById("text").innerText = msgs[i];
    i++;
  } else {
    document.getElementById("choice").style.display = "block";
  }
}

function yes() {
  document.getElementById("text").innerText = "Yayyy see you soon 💘";
}

// NO button move 😂
let no = document.getElementById("no");
no.onmouseover = function() {
  no.style.position = "absolute";
  no.style.top = Math.random() * 80 + "%";
  no.style.left = Math.random() * 80 + "%";
};

// hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 5000);
}, 400);
</script>

</body>
</html>
