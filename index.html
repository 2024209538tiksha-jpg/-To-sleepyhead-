<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For you</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #fff6f7;
  color: #333;
  font-family: 'Inter', sans-serif;
  text-align: center;
}

h1 {
  margin-top: 120px;
  font-family: 'Playfair Display', serif;
  font-size: 42px;
}

#text {
  margin-top: 40px;
  font-size: 22px;
  line-height: 1.6;
  opacity: 0;
  transition: opacity 1.2s ease;
}

button {
  margin-top: 40px;
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  background: #ff6b81;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3</h1>

<div id="text"></div>

<button onclick="start()">Open</button>

<script>
let msgs = [
  "Regardless of our fights 🤪",
  "I miss u sm here 😔🎀",
  "Meetup at my place? 😘",
  "this weekend 🐙",
  "It will be worth it, I promise to fill it with laughter, love, and good quality time 😽",
  "— from tikki <3"
];

let i = 0;

function start() {
  document.querySelector("button").style.display = "none";
  show();
}

function show() {
  let text = document.getElementById("text");

  if (i < msgs.length) {
    text.style.opacity = 0;

    setTimeout(() => {
      text.innerText = msgs[i];
      text.style.opacity = 1;
      i++;
      setTimeout(show, 2500);
    }, 500);
  }
}
</script>

</body>
</html>
