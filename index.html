<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meetup</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 120px;
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  letter-spacing: 1px;
  text-shadow: 0 0 15px rgba(255,255,255,0.7);
}

#text {
  margin-top: 40px;
  font-size: 30px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

/* buttons */
button {
  padding: 12px 28px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  background: white;
  color: #ff4d6d;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ff4d6d;
  color: white;
  position: absolute;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 6s linear infinite;
}

@keyframes float {
  to { transform: translateY(-900px); }
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3</h1>

<div id="text"></div>

<div id="buttons" style="display:none;">
  <button id="yes">YES 🥺💘</button>
  <button id="no">NO 😭</button>
</div>

<script>
let msgs = [
  "Regardless of our fights 🤪",
  "I miss u sm here 😔🎀",
  "Meetup at my place? 😘",
  "11 April 🐙",
  "— from tikki <3"
];

let i = 0;

function showMessages() {
  let textDiv = document.getElementById("text");

  if (i < msgs.length) {
    textDiv.style.opacity = 0;
    textDiv.style.transform = "translateY(20px)";

    setTimeout(() => {
      textDiv.innerText = msgs[i];
      textDiv.style.opacity = 1;
      textDiv.style.transform = "translateY(0)";
      i++;
      setTimeout(showMessages, 2200);
    }, 400);

  } else {
    document.getElementById("buttons").style.display = "block";
  }
}

window.onload = showMessages;

// YES click
document.getElementById("yes").onclick = function() {
  document.getElementById("text").innerText = "Yayyy see you soon 💘";
};

// NO button move 😂
let no = document.getElementById("no");
no.onmouseover = function() {
  no.style.top = Math.random() * 80 + "%";
  no.style.left = Math.random() * 80 + "%";
};

// floating hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (12 + Math.random()*20) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 300);
</script>

</body>
</html>
