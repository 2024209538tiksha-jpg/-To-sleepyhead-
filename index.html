<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meetup</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 120px;
  font-size: 42px;
}

#messages {
  margin-top: 40px;
}

.msg {
  font-size: 26px;
  margin-top: 20px;
  opacity: 0;
  transition: opacity 1s ease;
}

/* buttons */
button {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 25px;
  margin: 10px;
  cursor: pointer;
}

#yes {
  background: white;
  color: #ff4d6d;
}

#no {
  background: #ff4d6d;
  color: white;
  position: absolute;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 6s linear infinite;
}

@keyframes float {
  to { transform: translateY(-900px); }
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3</h1>

<button onclick="startMessages()">Start 💖</button>

<div id="messages">
  <div class="msg">Regardless of our fights 🤪</div>
  <div class="msg">I miss u sm here 😔🎀</div>
  <div class="msg">Meetup at my place? 😘</div>
  <div class="msg">Upcoming weekend 🐙</div>
  <div class="msg">It will be worth it, I promise to fill it with laughter, love, and good quality time 😽</div>
  <div class="msg">ik we'll get through this like we always have 🫂</div>
  <div class="msg">— from tikki &lt;3</div>
</div>

<div id="buttons" style="display:none;">
  <button id="yes">YES 😻</button>
  <button id="no">NO 😾</button>
</div>

<script>
function startMessages() {
  document.querySelector("button").style.display = "none";

  let msgs = document.querySelectorAll(".msg");

  msgs.forEach((el, i) => {
    setTimeout(() => {
      el.style.opacity = 1;
    }, i * 2500);
  });

  // show buttons after last message
  setTimeout(() => {
    document.getElementById("buttons").style.display = "block";
  }, msgs.length * 2500);
}

// YES click
document.getElementById("yes").onclick = function() {
  document.getElementById("messages").innerHTML = "<h2>Yayyy see you soon 💘</h2>";
};

// NO move 😂
let no = document.getElementById("no");
no.onmouseover = function() {
  no.style.top = Math.random() * 80 + "%";
  no.style.left = Math.random() * 80 + "%";
};

// hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 300);
</script>

</body>
</html>
