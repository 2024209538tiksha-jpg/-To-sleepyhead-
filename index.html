<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meetup</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 100px;
}

#text {
  margin-top: 30px;
  font-size: 24px;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 5s linear infinite;
}

@keyframes float {
  to { transform: translateY(-800px); }
}
</style>
</head>

<body>

<h1>Heylo sleepyhead &lt;3</h1>

<div id="text"></div>

<script>
let msgs = [
  "Regardless of our fights 🤪",
  "I miss u sm here 😔🎀",
  "Meetup at my place?",
  "11 April",
  "— from tikki"
];

let i = 0;

function showMessages() {
  if (i < msgs.length) {
    document.getElementById("text").innerText = msgs[i];
    i++;
    setTimeout(showMessages, 2000);
  }
}

// AUTO START (no click needed)
window.onload = showMessages;

// hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 5000);
}, 400);
</script>

</body>
</html>
