<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For you</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #ffffff;
  color: #000;
  font-family: 'Inter', sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 120px;
  font-family: 'Playfair Display', serif;
  font-size: 42px;
}

#text {
  margin-top: 40px;
  font-size: 22px;
  line-height: 1.6;
  opacity: 0;
  transition: opacity 1.2s ease;
}

/* button */
#start {
  margin-top: 40px;
  padding: 10px 24px;
  border-radius: 25px;
  border: none;
  background: black;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* yes no */
#buttons {
  margin-top: 30px;
  display: none;
}

#yes {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: black;
  color: white;
  margin: 10px;
  cursor: pointer;
}

#no {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: grey;
  color: white;
  position: absolute;
  cursor: pointer;
}

/* hearts */
.heart {
  position: absolute;
  bottom: -50px;
  animation: float 6s linear infinite;
  color: red;
}

@keyframes float {
  to { transform: translateY(-900px); }
}
</style>
</head>

<body>

<h1>heylo sleepyhead &lt;3</h1>

<div id="text"></div>

<button id="start">tap here…</button>

<div id="buttons">
  <button id="yes">YES 😻</button>
  <button id="no">NO 😾</button>
</div>

<script>
let msgs = [
  "Regardless of our fights… 🤪",
  "I miss you… more than I say 😔🎀",
  "So meetup at my place 🎀",
  "Upcoming weekend 🐙",
  "It will be worth it, I promise to fill it with laughter, love, and good quality time 😽",
  "It will include good talking session at terrace, endless cuddles, hugs n kisses and your favorite meal with dessert 😋",
  "ik we'll get through this like we always have 🫂",
  "— from tikki"
];

let i = 0;

function start() {
  document.getElementById("start").style.display = "none";
  show();
}

function show() {
  let text = document.getElementById("text");

  if (i < msgs.length) {
    text.style.opacity = 0;

    setTimeout(() => {
      text.innerText = msgs[i];
      text.style.opacity = 1;
      i++;
      setTimeout(show, 3000);
    }, 500);
  } else {
    document.getElementById("buttons").style.display = "block";
  }
}

document.getElementById("start").onclick = start;

// YES
document.getElementById("yes").onclick = function() {
  document.getElementById("text").innerText = "see you soon 💘";
};

// NO move 😂
let no = document.getElementById("no");
no.onmouseover = function() {
  no.style.top = Math.random() * 80 + "%";
  no.style.left = Math.random() * 80 + "%";
};

// hearts
setInterval(() => {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (12 + Math.random()*20) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 400);
</script>

</body>
</html>
